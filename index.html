<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Battleship</title><link rel="stylesheet" href="styles.css"/><script defer="defer" src="main.js"></script></head><body><div class="place-your-ship"><h1 class="game-title">Battleship</h1><p class="ships-length-title">Ships Length</p><p class="ships-lengths">Carrier: 5 · Battleship: 4 · Destroyer: 3 · Submarine: 3 · Patrol Boat: 2</p><div class="place-your-ship-container"><div class="set-player-grid"></div><div class="placing-controls"><select id="ship-select"></select> <select id="ship-direction"><option value="horizontal">Horizontal</option><option value="vertical">Vertical</option></select> <button class="place-ship-button">Place Ship</button> <button class="play-button">Play</button></div><p class="placement-error"></p></div><p>Place Your Ships</p></div><div class="main-container hidden"><div class="header"><h1>Battlesship</h1></div><div class="game-info"><p class="info">Hit all the squares occupied by your opponent's ships to sink them. The first player to sink all of their opponent's ships wins the game.</p></div><div class="boards-container"><div class="player-board"><div class="player-grid"></div><div class="player-ship-status"></div><p>Your Board</p></div><div class="opponent-board"><div class="opponent-grid"></div><div class="opponent-ship-status"></div><p>Opponent's Board</p></div></div></div><dialog class="game-result-dialog"><div class="result-container"><p class="game-result"></p><button class="replay">Play Again</button></div></dialog></body></html>
